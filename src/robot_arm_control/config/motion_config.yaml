# 抓取-放置运动参数
# 所有长度单位与机械臂控制器保持一致（当前为 mm / deg）

# 当前保持不变的 XYZ（用于第一步旋转）
current_xyz: [-115.955, -320.591, -428.274]

# home 点
home_xyz: [-115.955, -320.591, -428.274]
home_euler: [-0.199, -3.085, 1.215]

# 放置位姿
place_xyz: [588.896, -372.898, -205.981]
place_euler: [-0.199, -3.085, 1.215]

# 安全高度（第三步提升 Z 轴用）
safe_z_height: -428.274

# 容差与超时
position_tolerance: 5.0      # mm
rotation_tolerance: 0.5      # deg
step_timeout: 10.0           # s

# 夹爪动作等待时间
gripper_close_delay: 2.0
gripper_open_delay: 2.0

